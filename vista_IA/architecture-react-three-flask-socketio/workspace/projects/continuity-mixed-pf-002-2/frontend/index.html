<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Continuity Mixed PF 002</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Continuity mixed simulation">
      <canvas id="world" width="1280" height="720" data-render-mode="pending" aria-label="Simulacion visual"></canvas>

      <section class="hud" aria-label="Telemetria">
        <div class="hud-title">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Continuity Runner</span>
        </div>
        <dl class="metrics">
          <div>
            <dt>Distancia</dt>
            <dd id="distance-value">0.1 m</dd>
          </div>
          <div>
            <dt>Velocidad</dt>
            <dd id="speed-value">14.2 m/s</dd>
          </div>
          <div>
            <dt>Render</dt>
            <dd id="event-value">iniciando</dd>
          </div>
        </dl>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
