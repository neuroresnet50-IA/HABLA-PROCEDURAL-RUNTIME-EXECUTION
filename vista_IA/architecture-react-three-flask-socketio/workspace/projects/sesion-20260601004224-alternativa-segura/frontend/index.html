<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alternativa segura</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Cyberlace safe path</p>
          <h1>Alternativa segura</h1>
        </div>
        <div class="status-strip" aria-label="Estado de evidencia">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Datos sinteticos</span>
          <span class="status-divider"></span>
          <span id="event-value">iniciando validacion</span>
        </div>
      </header>

      <main class="workspace" aria-label="Panel de arquitectura segura">
        <section class="visual-panel" aria-label="Mapa de flujo sintetico">
          <canvas id="world" width="960" height="540" data-render-mode="fallback-2d"></canvas>
          <div class="hud" aria-label="Metricas renderizadas">
            <div>
              <span class="metric-label">Distancia</span>
              <strong id="distance-value">0 m</strong>
            </div>
            <div>
              <span class="metric-label">Velocidad</span>
              <strong id="speed-value">0 m/s</strong>
            </div>
            <div>
              <span class="metric-label">Modo</span>
              <strong id="mode-value">smoke</strong>
            </div>
          </div>
        </section>

        <section class="operations" aria-label="Controles y evidencia">
          <div class="section-heading">
            <p class="eyebrow">Runtime seguro</p>
            <h2>Validacion sin secretos reales</h2>
          </div>

          <div class="control-row">
            <button type="button" class="primary-action" data-action="rerun">Revalidar</button>
            <button type="button" class="secondary-action" data-action="toggle">Alternar luz</button>
          </div>

          <div id="pipeline-list" class="pipeline-list" aria-label="Etapas del flujo"></div>

          <div class="evidence-table-wrap">
            <table class="evidence-table">
              <caption>Evidencia sintetica</caption>
              <thead>
                <tr>
                  <th scope="col">Artefacto</th>
                  <th scope="col">Tipo</th>
                  <th scope="col">Estado</th>
                </tr>
              </thead>
              <tbody id="records-table"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
